
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: debug-statements
      - id: check-ast
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=auto'] # Replace "auto" with "lf" to enforce Linux/Mac line endings or "crlf" for Windows
        priority: 0

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject
        priority: 0

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        entry: markdownlint-cli2 --config pyproject.toml --configPointer /tool/markdownlint-cli2
        priority: 0

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        priority: 0

  # The built-in `check-json` hook does not support JSON5 files (~= JSON with comments and trailing commas). To lint
  # JSON5 files, use the `check-json5` hook instead.
  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5
        priority: 0

  # Ensure the `uv.lock` file is in sync with the `pyproject.toml` config.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock
        priority: 0

  # Ensure that `ruff` and `ty` versions here in the `prek` hooks align with the `uv.lock` file.
  - repo: https://github.com/tsvikas/sync-with-uv
    rev: v0.6.0
    hooks:
      - id: sync-with-uv
        priority: 1

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: [--fix]
        priority: 1
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        priority: 1

  - repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.99
    hooks:
      - id: ty
        priority: 1
